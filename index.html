<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Organizer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#141413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Organizer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f5f1;--card:#ffffff;--ink:#1c1c1a;--mute:#6f6e68;--line:#e4e2da;
  --acc:#2b6cb0;--acc-ink:#fff;--ok:#2f855a;--warn:#c05621;--bad:#c53030;--bar:#cfe0f3;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141413;--card:#1f1f1d;--ink:#f1efe8;--mute:#9b9a92;--line:#33322e;
    --acc:#5b9bd5;--acc-ink:#0d1a28;--ok:#68d391;--warn:#f6ad55;--bad:#fc8181;--bar:#24405d;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1f1f1d;--ink:#f1efe8;--mute:#9b9a92;--line:#33322e;
  --acc:#5b9bd5;--acc-ink:#0d1a28;--ok:#68d391;--warn:#f6ad55;--bad:#fc8181;--bar:#24405d;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:4px 0 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mute);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 12px;margin-bottom:14px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:100px;resize:vertical}
button{font:inherit;border:0;border-radius:14px;padding:15px 16px;cursor:pointer;color:var(--ink);background:var(--line);font-weight:600}
button:active{transform:scale(.98)}
.pri{background:var(--acc);color:var(--acc-ink)}
.ok{background:var(--ok);color:#fff}
.dng{background:transparent;color:var(--bad);border:1px solid var(--line)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.big{width:100%;font-size:18px;padding:18px}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(44px,17vw,76px);font-weight:700;text-align:center;letter-spacing:-.02em;margin:18px 0 4px}
.clock.sm{font-size:clamp(38px,14vw,60px);margin:10px 0 2px}
.sub{text-align:center;color:var(--mute);font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--mute)}
.pill.run{background:var(--ok);color:#fff}.pill.pause{background:var(--warn);color:#fff}
.focus,.seg{display:flex;gap:8px;margin-bottom:14px}
.focus button{flex:1;padding:14px 0;font-size:18px}
.seg button{flex:1;padding:12px 0}
.focus button.on,.seg button.on{background:var(--acc);color:var(--acc-ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);padding:10px 0;font-size:12px;border-radius:10px}
nav button.on{color:var(--acc)}
nav span{display:block;font-size:20px;line-height:1.2}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet button{width:100%;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90%}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.item .meta{color:var(--mute);font-size:13px;margin-top:2px}
.item .desc{font-size:15px;margin-top:6px}
.item .note{font-size:14px;margin-top:4px;color:var(--mute);white-space:pre-wrap}
.dots{letter-spacing:2px;color:var(--acc)}
.day{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:18px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.chips button{padding:8px 14px;font-size:14px;white-space:nowrap;border-radius:99px}
.chips button.on{background:var(--acc);color:var(--acc-ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);font-size:12px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar .n{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;background:var(--bar);border-radius:6px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar .v{width:58px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.bar.zero{opacity:.45}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.week i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}
.goal{height:10px;background:var(--bar);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.goal i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 12px;margin:0 6px 8px 0;font-size:14px}
.tag button{padding:2px 8px;border-radius:99px;background:none;color:var(--mute);font-size:16px}
.add{display:flex;gap:8px;margin-bottom:14px}.add input,.add select{margin:0}.add button{flex:0 0 auto}
.empty{color:var(--mute);text-align:center;padding:26px 0;font-size:14px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.sync{font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--mute)}
.sync.bad{color:var(--warn)}.sync.good{color:var(--ok)}
.cloud{color:var(--warn);font-size:12px}
.tbl{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}
.tbl table{border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--line);text-align:left;padding:8px 10px;font-size:12px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tcount{background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.typepill{font-size:12px;color:var(--mute);margin:-8px 0 14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 12px;color:var(--ink);text-transform:none;letter-spacing:0}
.chk input{width:auto;margin:0}
.mgr{padding:12px 0;border-top:1px solid var(--line)}
.mgr:first-of-type{border-top:0;padding-top:0}
.mgr b{font-size:15px}
.mgr .small{color:var(--mute);font-size:12px;margin-bottom:6px}
.mgr select{margin:6px 0 0;padding:9px 34px 9px 10px;font-size:14px}
/* planner */
.pmeta{color:var(--mute);font-size:14px;margin:-6px 0 4px}
.step{padding:14px 16px}
.step.done{border-color:var(--ok)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sname{min-width:0}
.sname b{font-size:17px}
.sname .hint{margin:2px 0 0}
.sact button{padding:12px 18px;font-size:16px;white-space:nowrap}
.step.active{border-color:var(--acc);border-width:2px}
.mini{padding:6px 11px;font-size:14px;border-radius:10px}
.edrow{display:flex;gap:6px;align-items:center}
.pbtns{display:flex;gap:10px;margin-top:12px}
.pbtns button{flex:1;padding:10px 0;font-size:14px}
.pbtns button.on{background:var(--acc);color:var(--acc-ink)}
.details{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-a="tab" data-v="timer"><span>⏱</span>Timer</button>
  <button data-a="tab" data-v="log"><span>🗒</span>Log</button>
  <button data-a="tab" data-v="sheet"><span>▦</span>Sheet</button>
  <button data-a="tab" data-v="stats"><span>📊</span>Stats</button>
  <button data-a="tab" data-v="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="over"></div>
<div id="toast" class="toast" style="display:none"></div>

<script>
(function(){
"use strict";
var KEY="time-organizer:v3", V2="time-organizer:v2", mem=null;

/* ---------- data model ----------
   types:    [{name, steps:[...]}]       reusable templates. A new project copies the template's steps.
   projects: [{name, type, status, plan:[...], link, result, pnotes}]
             plan = this project's own ordered step list (it can drift from the template)
   sessions: [{id, ts, end, ms, type, project, step, done, desc, focus, notes, synced}]
   ops:      queued structure changes waiting to be sent to the Google Sheet
   tomb:     ids of sessions deleted on this device, so a sync never brings them back              */
function fresh(){return{
  types:[
    {name:"YouTube video",steps:["Idea","Script","Film","Voiceover","Edit","Thumbnail","Publish"]},
    {name:"Hardware product",steps:["Concept","CAD","Prototype","Test","Documentation"]},
    {name:"Overhead",steps:["Admin","Email","Learning"]}
  ],
  projects:[{name:"Admin & overhead",type:"Overhead",status:"active",plan:["Admin","Email","Learning"],link:"",result:"",pnotes:""}],
  sessions:[],goalH:4,theme:"auto",url:"",awake:false,exported:0,seeded:false,v4:false,mode:"plan",tomb:[],
  draft:{project:"",step:"",desc:""},timers:[],ops:[]
};}
function migrate(o){
  var d=fresh();
  var acts=(o.actions&&o.actions.length)?o.actions.slice():["Other"];
  d.types=[{name:"General",steps:acts}];
  d.projects=(o.projects||[]).map(function(n){return{name:n,type:"General",status:"active",steps:[]};});
  d.sessions=(o.sessions||[]).map(function(x){x.type="General";x.step=x.action||"Other";x.done=false;x.synced=false;delete x.action;return x;});
  d.timers=(o.timers||[]).map(function(t){t.type="General";t.step=t.action||"Other";delete t.action;return t;});
  d.draft={project:(o.draft&&o.draft.project)||"",step:(o.draft&&o.draft.action)||"",desc:""};
  ["goalH","theme","awake","exported"].forEach(function(k){if(o[k]!==undefined)d[k]=o[k];});
  return d;
}
// Older saved data had a shared step list per type plus optional extras per project; give every project its own plan.
function fixData(s){
  s.projects.forEach(function(p){
    if(!Array.isArray(p.plan)){
      var t=s.types.filter(function(x){return x.name===p.type;})[0],base=t?t.steps.slice():[];
      (p.steps||[]).forEach(function(x){if(base.indexOf(x)<0)base.push(x);});
      p.plan=base;
    }
    delete p.steps;
    ["link","result","pnotes"].forEach(function(k){if(typeof p[k]!=="string")p[k]="";});
  });
  return s;
}
function load(){
  var s=null;
  try{var r=localStorage.getItem(KEY);if(r)s=JSON.parse(r);}catch(e){}
  if(!s){try{var o=localStorage.getItem(V2);if(o)s=migrate(JSON.parse(o));}catch(e){}}
  if(!s&&mem)s=mem;
  var d=fresh();
  if(!s)return d;
  for(var k in d){if(s[k]===undefined)s[k]=d[k];}
  return fixData(s);
}
var S=load();
function save(){
  var j=JSON.stringify(S);mem=JSON.parse(j);
  try{localStorage.setItem(KEY,j);}catch(e){}
}
function $(q){return document.querySelector(q);}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

var tab="timer", showStop=null, statRange="7", statProj="", cmpType="", armed=null, wake=null, toastT=null;
var addingP=false, addingS=false, editPlan=false, showDetails=false, newPName="", newPType="";
var syncing=false, syncMsg="", syncState="";

/* ---------- helpers ---------- */
function elapsed(t){return t.acc+(t.running&&t.startedAt?Date.now()-t.startedAt:0);}
function T(id){return S.timers.filter(function(t){return t.id===id;})[0];}
function anyRunning(){return S.timers.some(function(t){return t.running;});}
function tickClocks(){document.querySelectorAll(".clk").forEach(function(c){var t=T(+c.dataset.id);if(t)c.textContent=clock(elapsed(t));});}
function pad(n){return n<10?"0"+n:""+n;}
function clock(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);}
function dur(ms){var m=Math.round(ms/60000);if(ms<60000)return Math.round(ms/1000)+"s";var h=Math.floor(m/60);return h?h+"h "+pad(m%60)+"m":m+"m";}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dayLabel(k){var t=dayKey(Date.now()),y=dayKey(Date.now()-864e5);if(k===t)return"Today";if(k===y)return"Yesterday";var p=k.split("-");return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}
function stamp(t){var d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
function dots(n){return"●".repeat(n)+"○".repeat(5-n);}
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){t.style.display="none";},2600);}
function todayMs(){var k=dayKey(Date.now());return S.sessions.filter(function(x){return dayKey(x.ts)===k;}).reduce(function(a,x){return a+x.ms;},0);}
function opts(list,sel){return list.map(function(o){return'<option'+(o===sel?" selected":"")+'>'+esc(o)+'</option>';}).join("");}
function popts(list,sel){return list.map(function(p){return'<option value="'+esc(p.name)+'"'+(p.name===sel?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");}
function pending(){return S.sessions.filter(function(s){return!s.synced;}).length;}
function applyTheme(){var r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);}
async function keepAwake(on){
  try{
    if(on&&S.awake&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",function(){wake=null;});}
    else if(!on&&wake){await wake.release();wake=null;}
  }catch(e){}
}
function softRender(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;render();}

/* ---------- structure helpers (types / projects / plans) ---------- */
function lc(x){return String(x).trim().toLowerCase();}
function findCI(list,name){var n=lc(name);return list.filter(function(x){return lc(x.name)===n;})[0];}
function inListCI(list,s){var n=lc(s);return list.some(function(x){return lc(x)===n;});}
function dedupe(list){var seen={},out=[];list.forEach(function(x){var k=lc(x);if(k&&!seen[k]){seen[k]=1;out.push(String(x).trim());}});return out;}
function getType(n){return S.types.filter(function(t){return t.name===n;})[0];}
function getProj(n){return S.projects.filter(function(p){return p.name===n;})[0];}
function activeProjects(){return S.projects.filter(function(p){return p.status==="active";});}
function stepsFor(pn){var p=getProj(pn);return p?p.plan:[];}
function stepStat(pn,step){
  var ms=0,n=0,last=null;
  S.sessions.forEach(function(s){if(s.project===pn&&s.step===step){ms+=s.ms;n++;if(!last||s.ts>=last.ts)last=s;}});
  return{ms:ms,n:n,done:!!(last&&last.done)};
}
function enqueue(op){if(S.url){S.ops.push(op);save();}}
// Queue helpers: a newer "replace" op supersedes an older pending one for the same thing.
function queuePlan(p){if(!S.url)return;S.ops=S.ops.filter(function(o){return!(o.op==="set_plan"&&o.project===p.name);});S.ops.push({op:"set_plan",project:p.name,type:p.type,steps:p.plan.slice()});save();}
function queueTpl(name,steps){if(!S.url)return;S.ops=S.ops.filter(function(o){return!(o.op==="set_template"&&o.type===name);});S.ops.push({op:"set_template",type:name,steps:steps.slice()});save();}
function queueInfo(p){if(!S.url)return;S.ops=S.ops.filter(function(o){return!(o.op==="set_info"&&o.name===p.name);});S.ops.push({op:"set_info",name:p.name,link:p.link,result:p.result,notes:p.pnotes});save();}
function ensTypeLocal(name){var t=findCI(S.types,name);if(!t){t={name:String(name).trim(),steps:[]};S.types.push(t);}return t;}
function ensType(name){var had=!!findCI(S.types,name),t=ensTypeLocal(name);if(!had)queueTpl(t.name,t.steps);return t;}
function ensStep(t,step){if(!inListCI(t.steps,step)){t.steps.push(step);queueTpl(t.name,t.steps);}}
function ensProj(name,type,plan){
  var p=findCI(S.projects,name);
  if(!p){
    var t=ensTypeLocal(type);
    p={name:String(name).trim(),type:t.name,status:"active",plan:dedupe(plan||t.steps),link:"",result:"",pnotes:""};
    S.projects.push(p);
    enqueue({op:"add_project",name:p.name,type:p.type,status:"active",link:"",result:"",notes:""});queuePlan(p);
  }
  return p;
}

/* ---------- Google Sheets sync ---------- */
function payload(s){return{op:"session",id:s.id,timestamp:new Date(s.ts).toISOString(),type:s.type,project:s.project,step:s.step,minutes:+(s.ms/60000).toFixed(2),focus:s.focus,done:!!s.done,description:s.desc||"",notes:s.notes||""};}
function post(obj){return fetch(S.url,{method:"POST",mode:"no-cors",body:JSON.stringify(obj)});}
async function getRemote(){var r=await fetch(S.url+(S.url.indexOf("?")<0?"?":"&")+"t="+Date.now());return r.json();}
async function sendOps(){while(S.ops.length){await post(S.ops[0]);S.ops.shift();save();}}
function markSynced(j){
  var have={},ok=0;(j.logIds||[]).forEach(function(x){have[String(x)]=1;});
  S.sessions.forEach(function(s){if(!s.synced&&have[String(s.id)]){s.synced=true;ok++;}});
  return ok;
}
// Pull the sheet's structure and sessions into this device. The sheet wins for anything it already has.
function mergeRemote(j){
  var tpl={},plans={},legacy={};
  (j.steps||[]).forEach(function(r){
    if(!r.type||!r.step)return;
    if(!r.project){(tpl[lc(r.type)]=tpl[lc(r.type)]||{type:r.type,list:[]}).list.push(r.step);}
    else if(r.kind==="plan"){(plans[lc(r.project)]=plans[lc(r.project)]||[]).push(r.step);}
    else{(legacy[lc(r.project)]=legacy[lc(r.project)]||[]).push(r.step);}
  });
  Object.keys(tpl).forEach(function(k){ensTypeLocal(tpl[k].type).steps=dedupe(tpl[k].list);});
  (j.projects||[]).forEach(function(r){
    if(!r.name||!r.type)return;
    var ty=ensTypeLocal(r.type),st=/^(active|paused|done)$/.test(r.status)?r.status:"active",k=lc(r.name);
    var p=findCI(S.projects,r.name);
    if(!p){p={name:String(r.name).trim(),type:ty.name,status:st,plan:dedupe(plans[k]||ty.steps.concat(legacy[k]||[])),link:"",result:"",pnotes:""};S.projects.push(p);}
    else{p.status=st;if(plans[k])p.plan=dedupe(plans[k]);}
    if(r.link!==undefined)p.link=String(r.link||"");
    if(r.result!==undefined)p.result=String(r.result||"");
    if(r.notes!==undefined)p.pnotes=String(r.notes||"");
  });
  // sessions
  var rem={},loc={};
  (j.sessions||[]).forEach(function(r){rem[String(r.id)]=1;});
  if(j.complete)S.sessions=S.sessions.filter(function(s){return!s.synced||rem[String(s.id)];}); // deleted in the sheet
  S.sessions.forEach(function(s){loc[String(s.id)]=1;});
  (j.sessions||[]).forEach(function(r){
    var id=Number(r.id),ts=Number(r.ts),min=Number(r.minutes);
    if(!id||!ts||!(min>=0)||loc[String(id)]||S.tomb.indexOf(id)>=0)return;
    var ms=Math.round(min*60000);
    S.sessions.push({id:id,ts:ts,end:ts+ms,ms:ms,type:String(r.type||"General"),project:String(r.project||"Unknown"),step:String(r.step||"Other"),done:!!r.done,desc:String(r.description||""),focus:Math.min(5,Math.max(1,Number(r.focus)||3)),notes:String(r.notes||""),synced:true});
    loc[String(id)]=1;
  });
}
// One time per device: send whatever the sheet doesn't have yet (never overwrites what it has).
function seedMissing(j){
  var hasTpl={},hasPlan={},hasProj={},n=0;
  (j.steps||[]).forEach(function(r){if(!r.project)hasTpl[lc(r.type)]=1;else if(r.kind==="plan")hasPlan[lc(r.project)]=1;});
  (j.projects||[]).forEach(function(r){hasProj[lc(r.name)]=1;});
  S.types.forEach(function(t){if(t.steps.length&&!hasTpl[lc(t.name)]){S.ops.push({op:"set_template",type:t.name,steps:t.steps.slice()});n++;}});
  S.projects.forEach(function(p){
    if(!hasProj[lc(p.name)]){S.ops.push({op:"add_project",name:p.name,type:p.type,status:p.status,link:p.link,result:p.result,notes:p.pnotes});n++;}
    if(!hasPlan[lc(p.name)]){S.ops.push({op:"set_plan",project:p.name,type:p.type,steps:p.plan.slice()});n++;}
  });
  return n;
}
async function flush(){
  if(!S.url||syncing||!navigator.onLine)return;
  syncing=true;
  try{
    await sendOps();
    var q=S.sessions.filter(function(s){return!s.synced;});
    for(var i=0;i<q.length;i++)await post(payload(q[i]));
    var j=await getRemote(),ok=markSynced(j);
    mergeRemote(j);
    if(!S.v4){
      var cnt=seedMissing(j);S.v4=true;S.seeded=true;save();
      if(cnt){await sendOps();j=await getRemote();ok+=markSynced(j);mergeRemote(j);}
    }
    save();
    var left=pending();
    syncMsg=left?"Sent, but "+left+" session"+(left===1?"":"s")+" not confirmed by the sheet yet":"Synced"+(ok?" · "+ok+" uploaded":"");
    syncState=left?"bad":"good";
  }catch(e){syncMsg="Couldn't read the sheet — check the URL and that access is set to Anyone. Will retry.";syncState="bad";}
  syncing=false;softRender();
}

function viewStats(){
  var days=statRange==="all"?null:+statRange;
  var from=days===null?0:(function(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()-(days-1)*864e5;})();
  var rows=S.sessions.filter(function(s){return s.ts>=from;});
  var tot=rows.reduce(function(a,s){return a+s.ms;},0);
  var avgF=rows.length?(rows.reduce(function(a,s){return a+s.focus;},0)/rows.length).toFixed(1):"–";
  var h='<h1>Stats</h1><div class="chips">'
    +[["1","Today"],["7","7 days"],["30","30 days"],["all","All"]].map(function(c){return'<button data-a="range" data-v="'+c[0]+'" class="'+(statRange===c[0]?"on":"")+'">'+c[1]+'</button>';}).join("")
    +'</div><div class="stat"><div><b>'+dur(tot)+'</b><small>Total</small></div><div><b>'+rows.length+'</b><small>Sessions</small></div><div><b>'+avgF+'</b><small>Avg focus</small></div></div>';
  if(S.goalH){
    var tm=todayMs(),pc=Math.min(100,tm/(S.goalH*36e5)*100);
    h+='<div class="card"><label>Daily goal</label><div class="goal"><i style="width:'+pc+'%"></i></div><div class="sub" style="text-align:left">'+dur(tm)+' of '+S.goalH+'h today</div></div>';
  }
  var wk=[];for(var i=6;i>=0;i--){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);var k=dayKey(d.getTime());wk.push({k:k,l:d.toLocaleDateString(undefined,{weekday:"narrow"}),ms:S.sessions.filter(function(s){return dayKey(s.ts)===k;}).reduce(function(a,s){return a+s.ms;},0)});}
  var mx=Math.max.apply(null,wk.map(function(x){return x.ms;}).concat([1]));
  h+='<div class="card"><label>Last 7 days</label><div class="week">'+wk.map(function(x){return'<div><span>'+(x.ms?(x.ms/36e5).toFixed(1):"")+'</span><i style="height:'+(x.ms/mx*80)+'%"></i><span style="margin-top:4px">'+x.l+'</span></div>';}).join("")+'</div></div>';
  function group(field,title){
    var m={};rows.forEach(function(s){var o=m[s[field]]||(m[s[field]]={ms:0});o.ms+=s.ms;});
    var keys=Object.keys(m).sort(function(a,b){return m[b].ms-m[a].ms;});
    if(!keys.length)return"";
    var top=m[keys[0]].ms||1;
    return'<div class="card"><label>'+title+'</label>'+keys.map(function(k){return'<div class="bar"><span class="n">'+esc(k)+'</span><span class="t"><i style="width:'+(m[k].ms/top*100)+'%"></i></span><span class="v">'+dur(m[k].ms)+'</span></div>';}).join("")+'</div>';
  }
  if(!rows.length)h+='<div class="empty">Nothing logged in this range.</div>';
  else h+=group("project","By project")+group("type","By type")+group("step","By step");
  // per-project step breakdown (all time)
  var names=[];S.sessions.forEach(function(s){if(names.indexOf(s.project)<0)names.push(s.project);});
  if(names.length){
    if(names.indexOf(statProj)<0)statProj=names[0];
    var ps=S.sessions.filter(function(s){return s.project===statProj;});
    var steps=stepsFor(statProj).slice();
    ps.forEach(function(s){if(steps.indexOf(s.step)<0)steps.push(s.step);});
    var agg={};steps.forEach(function(s){agg[s]={ms:0,done:false};});
    steps.forEach(function(s){var q=stepStat(statProj,s);agg[s]={ms:q.ms,done:q.done};});
    var top2=Math.max.apply(null,steps.map(function(s){return agg[s].ms;}).concat([1]));
    h+='<div class="card"><label>Project breakdown (all time)</label><select id="statProj">'+opts(names,statProj)+'</select>'
      +steps.map(function(s){var a=agg[s];return'<div class="bar'+(a.ms||a.done?'':' zero')+'"><span class="n">'+esc(s)+(a.done?' ✓':'')+'</span><span class="t"><i style="width:'+(a.ms/top2*100)+'%"></i></span><span class="v">'+(a.ms?dur(a.ms):'–')+'</span></div>';}).join("")
      +'<div class="sub" style="text-align:left;margin-top:8px">Total '+dur(ps.reduce(function(a,s){return a+s.ms;},0))+'</div></div>';
  }
  // compare projects of the same type
  var tnames=[];S.projects.forEach(function(p){if(tnames.indexOf(p.type)<0&&S.sessions.some(function(s){return s.project===p.name;}))tnames.push(p.type);});
  if(tnames.length){
    if(tnames.indexOf(cmpType)<0)cmpType=tnames[0];
    var plist=S.projects.filter(function(p){return p.type===cmpType&&S.sessions.some(function(s){return s.project===p.name;});}).map(function(p){
      var ss=S.sessions.filter(function(s){return s.project===p.name;});
      var ms=ss.reduce(function(a,s){return a+s.ms;},0),f=ss.reduce(function(a,s){return a+s.focus;},0)/ss.length;
      var dn=p.plan.filter(function(st){return stepStat(p.name,st).done;}).length;
      return{p:p,ms:ms,n:ss.length,f:f,dn:dn};
    }).sort(function(a,b){return b.ms-a.ms;});
    h+='<div class="card"><label>Compare projects of one type</label><select id="cmpType">'+opts(tnames,cmpType)+'</select>'
      +plist.map(function(x){return'<div class="mgr"><b>'+esc(x.p.name)+'</b> <span class="hint">'+dur(x.ms)+' · '+x.n+' session'+(x.n===1?"":"s")+' · focus '+x.f.toFixed(1)+' · '+x.dn+'/'+x.p.plan.length+' steps done'+(x.p.status!=="active"?' · '+x.p.status:'')+'</span>'
        +(x.p.result?'<div class="small" style="margin:4px 0 0">'+esc(x.p.result)+'</div>':'')+'</div>';}).join("")+'</div>';
  }
  return h;
}

function viewSettings(){
  var statusSel=function(i,v){return'<select data-ps="'+i+'">'+["active","paused","done"].map(function(x){return'<option'+(x===v?" selected":"")+'>'+x+'</option>';}).join("")+'</select>';};
  var h='<h1>Settings</h1>'
   +'<div class="card"><label>Google Sheets sync</label>'
   +'<input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste your Apps Script web app URL" value="'+esc(S.url)+'" style="margin-bottom:10px">'
   +'<button class="pri big" data-a="sync" style="font-size:16px;padding:14px">Sync now</button>'
   +'<p class="hint sync '+syncState+'">'+(S.url?(syncMsg||(pending()?pending()+" session"+(pending()===1?"":"s")+" waiting to upload":"All sessions uploaded")):"Not connected — sessions are stored on this device only.")+'</p></div>'
   +'<div class="card"><label>Projects</label>';
  if(!S.projects.length)h+='<div class="hint">No projects yet. Add one from the Timer tab.</div>';
  S.projects.forEach(function(p,i){
    h+='<div class="mgr"><b>'+esc(p.name)+'</b><div class="small">'+esc(p.type)+' · '+p.plan.length+' steps</div>'+statusSel(i,p.status)+'</div>';
  });
  h+='<p class="hint">Only “active” projects show in the Timer. Edit a project’s steps from the Timer tab (Plan > Edit plan).</p></div>'
   +'<div class="card"><label>Templates: types and their default steps</label>';
  S.types.forEach(function(t,ti){
    h+='<div class="mgr"><b>'+esc(t.name)+'</b>'
      +'<div style="margin:8px 0">'+t.steps.map(function(s,si){return'<span class="tag">'+esc(s)+'<button data-a="rmstep" data-t="'+ti+'" data-v="'+si+'" aria-label="Remove">×</button></span>';}).join("")+'</div>'
      +'<div class="add"><input id="ns'+ti+'" placeholder="Add a default step to every new '+esc(t.name)+'"><button class="pri" data-a="addTstep" data-t="'+ti+'">Add</button></div>'
      +'<button class="dng" style="padding:6px 12px;font-size:13px" data-a="rmtype" data-t="'+ti+'">'+(armed==="t"+ti?"Tap again to remove type":"Remove type")+'</button></div>';
  });
  h+='<div class="mgr"><label>New type</label><input id="newTN" placeholder="Type name, e.g. Podcast episode" autocapitalize="words">'
   +'<input id="newTS" placeholder="Steps, separated by commas">'
   +'<button class="pri" data-a="addtype" style="width:100%">Add type</button></div>'
   +'<p class="hint">A template only supplies the starting steps for new projects. Existing projects keep their own plan. Renaming isn’t supported yet.</p></div>'
   +'<div class="card"><label>Daily goal (hours, 0 = off)</label><input id="goal" type="number" min="0" max="24" step="0.5" inputmode="decimal" value="'+S.goalH+'" style="margin-bottom:10px">'
   +'<label>Theme</label><select id="theme"><option value="auto"'+(S.theme==="auto"?" selected":"")+'>Match device</option><option value="light"'+(S.theme==="light"?" selected":"")+'>Light</option><option value="dark"'+(S.theme==="dark"?" selected":"")+'>Dark</option></select>'
   +'<label>Keep screen on while timing</label><select id="awake" style="margin-bottom:0"><option value="0"'+(!S.awake?" selected":"")+'>Off (screen can lock)</option><option value="1"'+(S.awake?" selected":"")+'>On</option></select></div>'
   +'<div class="card"><label>Backup</label><div class="row"><button data-a="json">Save backup</button><button data-a="copyjson">Copy backup</button></div>'
   +'<p class="hint">Includes sessions, types and projects.</p></div>'
   +'<div class="card"><label>Restore backup (paste)</label><textarea id="restore" placeholder="Paste a backup here — new or from an older version" style="min-height:70px"></textarea><button data-a="restore" class="big">Merge into app</button></div>'
   +'<div class="card"><button class="dng big" data-a="wipe">'+(armed==="wipe"?"Tap again to clear sessions here":"Clear sessions from this device")+'</button><p class="hint">Only clears this device. The Google Sheet keeps its rows; delete rows there yourself if you want them gone.</p></div>';
  return h;
}

function render(){
  $("#app").innerHTML=tab==="timer"?viewTimer():tab==="log"?viewLog():tab==="sheet"?viewSheet():tab==="stats"?viewStats():viewSettings();
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===tab);});
  var nb=$('#nav [data-v="timer"]');if(nb)nb.innerHTML='<span>⏱</span>Timer'+(S.timers.length?'<span class="tcount" style="display:inline;font-size:11px">'+S.timers.length+'</span>':'');
  var st=showStop&&T(showStop);
  $("#over").innerHTML=st?'<div class="sheet-bg" data-a="cancel" data-bg="1"><div class="sheet"><div style="font-weight:700;font-size:18px">Stop timer?</div><div class="sub" style="text-align:left">'+clock(elapsed(st))+' on '+esc(st.project)+' · '+esc(st.step)+'</div><button class="ok" data-a="tosave" data-id="'+st.id+'">Save session</button><button class="dng" data-a="trash" data-id="'+st.id+'">Delete</button><button data-a="cancel">Cancel</button></div></div>':"";
}

/* ---------- export ---------- */
function rowsSorted(){return S.sessions.slice().sort(function(a,b){return a.ts-b.ts;});}
function cell(v){v=String(v==null?"":v);return/[",\n\r\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function flat(v){return String(v||"").replace(/[\t\r\n]+/g," ");}
function tsvOf(list){return list.map(function(s){return[stamp(s.ts),s.type,s.project,s.step,(s.ms/60000).toFixed(1),s.focus,s.done?"Yes":"No",flat(s.desc),flat(s.notes)].join("\t");}).join("\n");}
function tsv(){return tsvOf(rowsSorted());}
function csv(){return"Date,Type,Project,Step,Minutes,Focus,Step done,Description,Notes\n"+rowsSorted().map(function(s){return[stamp(s.ts),s.type,s.project,s.step,(s.ms/60000).toFixed(1),s.focus,s.done?"Yes":"No",s.desc||"",s.notes||""].map(cell).join(",");}).join("\n");}
function backup(){return{v:4,types:S.types,projects:S.projects,sessions:S.sessions};}
async function saveFile(name,data,type){
  try{
    var dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:data});toast("Saved");return;}
  }catch(e){if(e&&e.code==="declined")return;}
  try{
    var file=new File([data],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}
    var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  }catch(e){if(e&&e.name!=="AbortError")toast("Couldn't save — try Copy instead");}
}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg);return;}catch(e){}
  try{var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();var ok=document.execCommand("copy");document.body.removeChild(t);toast(ok?msg:"Copy blocked on this device");}
  catch(e){toast("Copy blocked on this device");}
}
function restoreData(data){
  var list=Array.isArray(data)?data:(data&&data.sessions)||[];
  if(!Array.isArray(list))throw new Error("bad");
  if(data&&!Array.isArray(data)){
    (data.types||[]).forEach(function(t){if(t&&t.name){var ty=ensType(t.name);(t.steps||[]).forEach(function(s){ensStep(ty,String(s));});}});
    (data.projects||[]).forEach(function(p){
      if(!(p&&p.name&&p.type))return;
      var ty=ensType(p.type),base=Array.isArray(p.plan)?p.plan.slice():ty.steps.slice();
      (p.steps||[]).forEach(function(x){if(!inListCI(base,x))base.push(String(x));});
      var np=ensProj(p.name,ty.name,base);
      if(/^(paused|done)$/.test(p.status)&&np.status==="active"){np.status=p.status;enqueue({op:"set_status",name:np.name,status:np.status});}
      var ch=false;["link","result","pnotes"].forEach(function(k){if(p[k]&&!np[k]){np[k]=String(p[k]);ch=true;}});
      if(ch)queueInfo(np);
    });
  }
  var have={},added=0;S.sessions.forEach(function(s){have[s.id]=1;});
  list.forEach(function(s){
    if(!s||!s.id||!(s.ms>=0)||have[s.id])return;
    var tn=String(s.type||"General"),pn=String(s.project||"Unknown"),st=String(s.step||s.action||"Other");
    var ty=ensType(tn);ensStep(ty,st);
    var p=findCI(S.projects,pn)||ensProj(pn,ty.name,ty.steps);
    if(!inListCI(p.plan,st)){p.plan.push(st);queuePlan(p);}
    S.sessions.push({id:s.id,ts:s.ts,end:s.end||s.ts,ms:s.ms,type:p.type,project:p.name,step:st,done:!!s.done,desc:String(s.desc||""),focus:Math.min(5,Math.max(1,s.focus|0||3)),notes:String(s.notes||""),synced:false});
    S.tomb=S.tomb.filter(function(x){return x!==s.id;});
    have[s.id]=1;added++;
  });
  return added;
}

/* ---------- actions ---------- */
function startTimer(p,step){
  var id=Date.now();while(T(id))id++;
  S.timers.push({id:id,project:p.name,type:p.type,step:step,desc:"",running:true,startedAt:Date.now(),acc:0,first:Date.now(),phase:"run",focus:3,done:false,notes:""});
  save();keepAwake(true);
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;
  if(el.dataset.bg&&e.target!==el)return;
  var a=el.dataset.a,v=el.dataset.v,d=S.draft,t=el.dataset.id?T(+el.dataset.id):null;
  if(a!=="del"&&a!=="wipe"&&a!=="rmtype")armed=null;
  switch(a){
    case"tab":tab=v;render();return;
    case"mode":S.mode=v;addingP=false;addingS=false;save();break;
    case"go":
      var gp=getProj(d.project),gs=gp&&gp.plan[+el.dataset.s];
      if(!gs)break;
      startTimer(gp,gs);break;
    case"start":
      var sp=$("#selP"),ss=$("#selS"),dd0=$("#desc");
      if(sp)d.project=sp.value;if(ss)d.step=ss.value;if(dd0)d.desc=dd0.value;
      var pj=getProj(d.project);
      if(!pj||!d.step){toast("Pick a project and a step first");return;}
      startTimer(pj,d.step);
      S.timers[S.timers.length-1].desc=(d.desc||"").trim();d.desc="";save();break;
    case"pause":if(t&&t.running){t.acc+=Date.now()-t.startedAt;t.running=false;t.startedAt=null;}save();if(!anyRunning())keepAwake(false);break;
    case"resume":if(t&&!t.running){t.running=true;t.startedAt=Date.now();}save();keepAwake(true);break;
    case"stop":
      if(!t)break;
      if(t.running){t.acc+=Date.now()-t.startedAt;t.running=false;t.startedAt=null;}
      if(!anyRunning())keepAwake(false);showStop=t.id;save();break;
    case"cancel":showStop=null;break;
    case"trash":showStop=null;S.timers=S.timers.filter(function(x){return x!==t;});save();toast("Timer deleted");break;
    case"tosave":showStop=null;if(t){t.phase="save";t.end=Date.now();t.focus=3;t.done=false;}save();break;
    case"focus":if(t){t.focus=+v;save();}break;
    case"done":if(t){t.done=v==="1";save();}break;
    case"commit":
      if(!t)break;
      var sid=Date.now();while(S.sessions.some(function(x){return x.id===sid;}))sid++;
      S.sessions.push({id:sid,ts:t.first,end:t.end||Date.now(),ms:t.acc,type:t.type,project:t.project,step:t.step,done:!!t.done,desc:(t.desc||"").trim(),focus:t.focus,notes:(t.notes||"").trim(),synced:false});
      S.timers=S.timers.filter(function(x){return x!==t;});
      save();toast("Session saved · "+dur(t.acc));flush();break;
    case"discard":S.timers=S.timers.filter(function(x){return x!==t;});save();break;
    case"del":
      if(armed==="s"+v){
        var did=Number(v);S.sessions=S.sessions.filter(function(s){return String(s.id)!==v;});
        S.tomb.push(did);enqueue({op:"delete_session",id:did});armed=null;save();
      }else armed="s"+v;
      break;
    case"range":statRange=v;break;
    case"newP":addingP=true;newPName="";break;
    case"newS":addingS=true;break;
    case"cancelAdd":addingP=false;addingS=false;break;
    case"toggleEdit":editPlan=!editPlan;break;
    case"toggleDetails":showDetails=!showDetails;break;
    case"addP":
      var pn=($("#newPN").value||"").trim(),pty=getType($("#newPT")?$("#newPT").value:"");
      if(!pn){toast("Type a project name first");return;}
      if(!pty){toast("Choose a type first");return;}
      var picked=[];
      document.querySelectorAll("input[data-pstep]").forEach(function(c){if(c.checked)picked.push(pty.steps[+c.dataset.pstep]);});
      var exp=findCI(S.projects,pn);
      if(exp){if(exp.status!=="active"){exp.status="active";enqueue({op:"set_status",name:exp.name,status:"active"});}d.project=exp.name;toast("That project already exists — opened it");}
      else{d.project=ensProj(pn,pty.name,picked).name;}
      d.step="";addingP=false;newPName="";save();break;
    case"mvup":case"mvdn":
      var mp=getProj(d.project),mi=+el.dataset.s,mj=a==="mvup"?mi-1:mi+1;
      if(mp&&mj>=0&&mj<mp.plan.length){var tmp=mp.plan[mi];mp.plan[mi]=mp.plan[mj];mp.plan[mj]=tmp;queuePlan(mp);save();}
      break;
    case"rmplan":
      var rp=getProj(d.project);
      if(rp){rp.plan.splice(+el.dataset.s,1);queuePlan(rp);save();}
      break;
    case"addS":
      var sn=($("#newSN").value||"").trim(),alsoT=$("#newSO")&&$("#newSO").checked,cp=getProj(d.project);
      if(!sn){toast("Type a step name first");return;}
      if(!cp)break;
      var known=cp.plan.filter(function(x){return lc(x)===lc(sn);})[0];
      if(known){d.step=known;toast("That step is already in the plan");}
      else{
        cp.plan.push(sn);queuePlan(cp);d.step=sn;
        if(alsoT){var ct=getType(cp.type);if(ct&&!inListCI(ct.steps,sn)){ct.steps.push(sn);queueTpl(ct.name,ct.steps);}}
      }
      addingS=false;save();break;
    case"addTstep":
      var ti=+el.dataset.t,tt=S.types[ti],ni=$("#ns"+ti),nv=ni?ni.value.trim():"";
      if(tt&&nv){if(inListCI(tt.steps,nv)){toast("That step already exists");return;}tt.steps.push(nv);queueTpl(tt.name,tt.steps);save();}
      break;
    case"rmstep":
      var rt0=S.types[+el.dataset.t];
      if(rt0){rt0.steps.splice(+v,1);queueTpl(rt0.name,rt0.steps);save();}
      break;
    case"rmtype":
      var rt=S.types[+el.dataset.t];
      if(S.projects.some(function(p){return p.type===rt.name;})){toast("Some projects use this type — keep it, or mark them done");return;}
      if(armed==="t"+el.dataset.t){queueTpl(rt.name,[]);S.types.splice(+el.dataset.t,1);armed=null;save();}else armed="t"+el.dataset.t;
      break;
    case"addtype":
      var tn=($("#newTN").value||"").trim(),steps=dedupe(($("#newTS").value||"").split(","));
      if(!tn||!steps.length){toast("Give the type a name and at least one step");return;}
      if(findCI(S.types,tn)){toast("That type already exists");return;}
      S.types.push({name:tn,steps:steps});queueTpl(tn,steps);save();toast("Type added");break;
    case"sync":
      var u=$("#url");if(u){S.url=u.value.trim();save();}
      if(!S.url){syncMsg="Paste your web app URL first";syncState="bad";break;}
      syncMsg="Syncing…";syncState="";render();flush();return;
    case"csv":saveFile("time-log.csv",csv(),"text/csv");return;
    case"json":saveFile("time-organizer-backup.json",JSON.stringify(backup(),null,1),"application/json");return;
    case"copynew":
      var nr=newRows();if(!nr.length){toast("No new rows");return;}
      copy(tsvOf(nr),"Copied "+nr.length+" new row"+(nr.length===1?"":"s"));
      S.exported=Math.max.apply(null,nr.map(function(s){return s.id;}));save();setTimeout(render,50);return;
    case"copytsv":copy(tsv(),"Copied "+S.sessions.length+" rows");return;
    case"copyjson":copy(JSON.stringify(backup()),"Backup copied");return;
    case"restore":
      try{var added=restoreData(JSON.parse($("#restore").value));save();toast("Added "+added+" session"+(added===1?"":"s"));flush();}
      catch(err){toast("That doesn't look like a backup");return;}
      break;
    case"wipe":
      if(armed==="wipe"){S.sessions.forEach(function(s){S.tomb.push(s.id);});S.sessions=[];armed=null;save();toast("Cleared from this device");}
      else armed="wipe";
      break;
  }
  render();
});
document.addEventListener("input",function(e){
  var tg=e.target,tid=tg.dataset&&tg.dataset.tid;
  if(tid){var tt=T(+tid);if(tt){tt[tg.dataset.f]=tg.value;save();}return;}
  if(tg.dataset&&tg.dataset.pinfo){var pp=getProj(S.draft.project);if(pp){pp[tg.dataset.pinfo]=tg.value;save();}return;}
  if(tg.id==="newPN"){newPName=tg.value;return;}
  if(tg.id==="desc"){S.draft.desc=tg.value;save();}
});
document.addEventListener("change",function(e){
  var tg=e.target,id=tg.id;
  if(tg.dataset&&tg.dataset.pinfo){var pi=getProj(S.draft.project);if(pi)queueInfo(pi);return;}
  if(tg.dataset&&tg.dataset.pstat!==undefined){
    var ps0=getProj(S.draft.project);
    if(ps0){ps0.status=tg.value;enqueue({op:"set_status",name:ps0.name,status:ps0.status});save();render();}
    return;
  }
  if(tg.dataset&&tg.dataset.ps!==undefined){
    var p=S.projects[+tg.dataset.ps];
    if(p){p.status=tg.value;enqueue({op:"set_status",name:p.name,status:p.status});save();}
    return;
  }
  if(id==="newPT"){newPType=tg.value;render();}
  else if(id==="selP"){S.draft.project=tg.value;S.draft.step="";editPlan=false;showDetails=false;save();render();}
  else if(id==="selS"){S.draft.step=tg.value;save();}
  else if(id==="statProj"){statProj=tg.value;render();}
  else if(id==="cmpType"){cmpType=tg.value;render();}
  else if(id==="goal"){S.goalH=Math.max(0,Math.min(24,parseFloat(tg.value)||0));save();}
  else if(id==="theme"){S.theme=tg.value;applyTheme();save();}
  else if(id==="awake"){S.awake=tg.value==="1";save();if(!S.awake)keepAwake(false);}
  else if(id==="url"){S.url=tg.value.trim();save();}
});

/* ---------- lifecycle ---------- */
// Timers store wall-clock timestamps, so they stay accurate while the phone is locked.
setInterval(tickClocks,250);
setInterval(function(){if(S.ops.length||pending())flush();},30000);
window.addEventListener("online",function(){flush();});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){
    tickClocks();
    if(anyRunning())keepAwake(true);
    flush();
  }
});

applyTheme();
save();
if(anyRunning())keepAwake(true);
render();
if(S.url)flush();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
})();
</script>
