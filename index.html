<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Organizer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#141413">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Organizer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f5f1;--card:#ffffff;--ink:#1c1c1a;--mute:#6f6e68;--line:#e4e2da;
  --acc:#2b6cb0;--acc-ink:#fff;--ok:#2f855a;--warn:#c05621;--bad:#c53030;--bar:#cfe0f3;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141413;--card:#1f1f1d;--ink:#f1efe8;--mute:#9b9a92;--line:#33322e;
    --acc:#5b9bd5;--acc-ink:#0d1a28;--ok:#68d391;--warn:#f6ad55;--bad:#fc8181;--bar:#24405d;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1f1f1d;--ink:#f1efe8;--mute:#9b9a92;--line:#33322e;
  --acc:#5b9bd5;--acc-ink:#0d1a28;--ok:#68d391;--warn:#f6ad55;--bad:#fc8181;--bar:#24405d;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:4px 0 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mute);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 12px;margin-bottom:14px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea{min-height:100px;resize:vertical}
button{font:inherit;border:0;border-radius:14px;padding:15px 16px;cursor:pointer;color:var(--ink);background:var(--line);font-weight:600}
button:active{transform:scale(.98)}
.pri{background:var(--acc);color:var(--acc-ink)}
.ok{background:var(--ok);color:#fff}
.dng{background:transparent;color:var(--bad);border:1px solid var(--line)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.big{width:100%;font-size:18px;padding:18px}
.clock{font-variant-numeric:tabular-nums;font-size:clamp(44px,17vw,76px);font-weight:700;text-align:center;letter-spacing:-.02em;margin:18px 0 4px}
.clock.sm{font-size:clamp(38px,14vw,60px);margin:10px 0 2px}
.sub{text-align:center;color:var(--mute);font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--mute)}
.pill.run{background:var(--ok);color:#fff}.pill.pause{background:var(--warn);color:#fff}
.focus,.seg{display:flex;gap:8px;margin-bottom:14px}
.focus button{flex:1;padding:14px 0;font-size:18px}
.seg button{flex:1;padding:12px 0}
.focus button.on,.seg button.on{background:var(--acc);color:var(--acc-ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);padding:10px 0;font-size:12px;border-radius:10px}
nav button.on{color:var(--acc)}
nav span{display:block;font-size:20px;line-height:1.2}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet button{width:100%;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90%}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.item .meta{color:var(--mute);font-size:13px;margin-top:2px}
.item .desc{font-size:15px;margin-top:6px}
.item .note{font-size:14px;margin-top:4px;color:var(--mute);white-space:pre-wrap}
.dots{letter-spacing:2px;color:var(--acc)}
.day{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:18px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.chips button{padding:8px 14px;font-size:14px;white-space:nowrap;border-radius:99px}
.chips button.on{background:var(--acc);color:var(--acc-ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);font-size:12px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar .n{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;background:var(--bar);border-radius:6px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar .v{width:58px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.bar.zero{opacity:.45}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.week i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}
.goal{height:10px;background:var(--bar);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.goal i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 12px;margin:0 6px 8px 0;font-size:14px}
.tag button{padding:2px 8px;border-radius:99px;background:none;color:var(--mute);font-size:16px}
.add{display:flex;gap:8px;margin-bottom:14px}.add input,.add select{margin:0}.add button{flex:0 0 auto}
.empty{color:var(--mute);text-align:center;padding:26px 0;font-size:14px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
.sync{font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--mute)}
.sync.bad{color:var(--warn)}.sync.good{color:var(--ok)}
.cloud{color:var(--warn);font-size:12px}
.tbl{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}
.tbl table{border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--line);text-align:left;padding:8px 10px;font-size:12px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tcount{background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.typepill{font-size:12px;color:var(--mute);margin:-8px 0 14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:-6px 0 14px;color:var(--ink);text-transform:none;letter-spacing:0}
.chk input{width:auto;margin:0}
.mgr{padding:12px 0;border-top:1px solid var(--line)}
.mgr:first-of-type{border-top:0;padding-top:0}
.mgr b{font-size:15px}
.mgr .small{color:var(--mute);font-size:12px;margin-bottom:6px}
.mgr select{margin:6px 0 0;padding:9px 34px 9px 10px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-a="tab" data-v="timer"><span>⏱</span>Timer</button>
  <button data-a="tab" data-v="log"><span>🗒</span>Log</button>
  <button data-a="tab" data-v="sheet"><span>▦</span>Sheet</button>
  <button data-a="tab" data-v="stats"><span>📊</span>Stats</button>
  <button data-a="tab" data-v="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="over"></div>
<div id="toast" class="toast" style="display:none"></div>

<script>
(function(){
"use strict";
var KEY="time-organizer:v3", V2="time-organizer:v2", mem=null;

/* ---------- data model ----------
   types:    [{name, steps:[...]}]                  reusable process templates
   projects: [{name, type, status, steps:[...]}]    steps here = extra steps for just this project
   sessions: [{id, ts, end, ms, type, project, step, done, desc, focus, notes, synced}]
   ops:      queued structure changes waiting to be sent to the Google Sheet                    */
function fresh(){return{
  types:[
    {name:"YouTube video",steps:["Idea","Script","Film","Edit","Thumbnail","Publish"]},
    {name:"Hardware product",steps:["Concept","CAD","Prototype","Test","Documentation"]},
    {name:"Overhead",steps:["Admin","Email","Learning"]}
  ],
  projects:[{name:"Admin & overhead",type:"Overhead",status:"active",steps:[]}],
  sessions:[],goalH:4,theme:"auto",url:"",awake:false,exported:0,seeded:false,
  draft:{project:"",step:"",desc:""},timers:[],ops:[]
};}
function migrate(o){
  var d=fresh();
  var acts=(o.actions&&o.actions.length)?o.actions.slice():["Other"];
  d.types=[{name:"General",steps:acts}];
  d.projects=(o.projects||[]).map(function(n){return{name:n,type:"General",status:"active",steps:[]};});
  d.sessions=(o.sessions||[]).map(function(x){x.type="General";x.step=x.action||"Other";x.done=false;x.synced=false;delete x.action;return x;});
  d.timers=(o.timers||[]).map(function(t){t.type="General";t.step=t.action||"Other";delete t.action;return t;});
  d.draft={project:(o.draft&&o.draft.project)||"",step:(o.draft&&o.draft.action)||"",desc:""};
  ["goalH","theme","awake","exported"].forEach(function(k){if(o[k]!==undefined)d[k]=o[k];});
  return d;
}
function load(){
  var s=null;
  try{var r=localStorage.getItem(KEY);if(r)s=JSON.parse(r);}catch(e){}
  if(!s){try{var o=localStorage.getItem(V2);if(o)s=migrate(JSON.parse(o));}catch(e){}}
  if(!s&&mem)s=mem;
  var d=fresh();
  if(!s)return d;
  for(var k in d){if(s[k]===undefined)s[k]=d[k];}
  return s;
}
var S=load();
function save(){
  var j=JSON.stringify(S);mem=JSON.parse(j);
  try{localStorage.setItem(KEY,j);}catch(e){}
}
function $(q){return document.querySelector(q);}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

var tab="timer", showStop=null, statRange="7", statProj="", armed=null, wake=null, toastT=null;
var addingP=false, addingS=false, syncing=false, syncMsg="", syncState="";

/* ---------- helpers ---------- */
function elapsed(t){return t.acc+(t.running&&t.startedAt?Date.now()-t.startedAt:0);}
function T(id){return S.timers.filter(function(t){return t.id===id;})[0];}
function anyRunning(){return S.timers.some(function(t){return t.running;});}
function tickClocks(){document.querySelectorAll(".clk").forEach(function(c){var t=T(+c.dataset.id);if(t)c.textContent=clock(elapsed(t));});}
function pad(n){return n<10?"0"+n:""+n;}
function clock(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);}
function dur(ms){var m=Math.round(ms/60000);if(ms<60000)return Math.round(ms/1000)+"s";var h=Math.floor(m/60);return h?h+"h "+pad(m%60)+"m":m+"m";}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dayLabel(k){var t=dayKey(Date.now()),y=dayKey(Date.now()-864e5);if(k===t)return"Today";if(k===y)return"Yesterday";var p=k.split("-");return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}
function stamp(t){var d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
function dots(n){return"●".repeat(n)+"○".repeat(5-n);}
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){t.style.display="none";},2600);}
function todayMs(){var k=dayKey(Date.now());return S.sessions.filter(function(x){return dayKey(x.ts)===k;}).reduce(function(a,x){return a+x.ms;},0);}
function opts(list,sel){return list.map(function(o){return'<option'+(o===sel?" selected":"")+'>'+esc(o)+'</option>';}).join("");}
function popts(list,sel){return list.map(function(p){return'<option value="'+esc(p.name)+'"'+(p.name===sel?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");}
function pending(){return S.sessions.filter(function(s){return!s.synced;}).length;}
function applyTheme(){var r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);}
async function keepAwake(on){
  try{
    if(on&&S.awake&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",function(){wake=null;});}
    else if(!on&&wake){await wake.release();wake=null;}
  }catch(e){}
}
function softRender(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;render();}

/* ---------- structure helpers (types / projects / steps) ---------- */
function findCI(list,name){var n=String(name).trim().toLowerCase();return list.filter(function(x){return String(x.name).trim().toLowerCase()===n;})[0];}
function inListCI(list,s){var n=String(s).trim().toLowerCase();return list.some(function(x){return String(x).trim().toLowerCase()===n;});}
function getType(n){return S.types.filter(function(t){return t.name===n;})[0];}
function getProj(n){return S.projects.filter(function(p){return p.name===n;})[0];}
function activeProjects(){return S.projects.filter(function(p){return p.status==="active";});}
function stepsFor(pn){
  var p=getProj(pn);if(!p)return[];
  var t=getType(p.type),base=t?t.steps:[];
  return base.concat(p.steps.filter(function(s){return base.indexOf(s)<0;}));
}
function enqueue(op){if(S.url){S.ops.push(op);save();}}
function ensType(name){var t=findCI(S.types,name);if(!t){t={name:String(name).trim(),steps:[]};S.types.push(t);}return t;}
function ensStep(t,step){if(!inListCI(t.steps,step)){t.steps.push(step);enqueue({op:"add_step",type:t.name,step:step,project:""});}}
function ensProj(name,type){var p=findCI(S.projects,name);if(!p){p={name:String(name).trim(),type:type,status:"active",steps:[]};S.projects.push(p);enqueue({op:"add_project",name:p.name,type:type,status:"active"});}return p;}

/* ---------- Google Sheets sync ---------- */
function payload(s){return{op:"session",id:s.id,timestamp:new Date(s.ts).toISOString(),type:s.type,project:s.project,step:s.step,minutes:+(s.ms/60000).toFixed(2),focus:s.focus,done:!!s.done,description:s.desc||"",notes:s.notes||""};}
function post(obj){return fetch(S.url,{method:"POST",mode:"no-cors",body:JSON.stringify(obj)});}
async function getRemote(){var r=await fetch(S.url+(S.url.indexOf("?")<0?"?":"&")+"t="+Date.now());return r.json();}
function seedOps(){
  S.types.forEach(function(t){S.ops.push({op:"add_type",name:t.name,steps:t.steps.slice()});});
  S.projects.forEach(function(p){
    S.ops.push({op:"add_project",name:p.name,type:p.type,status:p.status});
    p.steps.forEach(function(st){S.ops.push({op:"add_step",type:p.type,step:st,project:p.name});});
  });
}
function mergeRemote(j){
  (j.projects||[]).forEach(function(r){
    if(!r.name||!r.type)return;
    ensTypeLocal(r.type);
    var p=findCI(S.projects,r.name),st=/^(active|paused|done)$/.test(r.status)?r.status:"active";
    if(!p)S.projects.push({name:r.name,type:r.type,status:st,steps:[]});
    else p.status=st;
  });
  (j.steps||[]).forEach(function(r){
    if(!r.type||!r.step)return;
    var ty=ensTypeLocal(r.type);
    if(!r.project){if(!inListCI(ty.steps,r.step))ty.steps.push(r.step);}
    else{var p=findCI(S.projects,r.project);if(p&&!inListCI(stepsFor(p.name),r.step))p.steps.push(r.step);}
  });
}
function ensTypeLocal(name){var t=findCI(S.types,name);if(!t){t={name:String(name).trim(),steps:[]};S.types.push(t);}return t;}
async function flush(){
  if(!S.url||syncing||!navigator.onLine)return;
  syncing=true;
  try{
    if(!S.seeded){seedOps();S.seeded=true;save();}
    while(S.ops.length){await post(S.ops[0]);S.ops.shift();save();}
    var q=S.sessions.filter(function(s){return!s.synced;});
    for(var i=0;i<q.length;i++)await post(payload(q[i]));
    var j=await getRemote(),have={},ok=0;
    (j.logIds||[]).forEach(function(x){have[String(x)]=1;});
    S.sessions.forEach(function(s){if(!s.synced&&have[String(s.id)]){s.synced=true;ok++;}});
    mergeRemote(j);save();
    var left=pending();
    syncMsg=left?"Sent, but "+left+" session"+(left===1?"":"s")+" not confirmed by the sheet yet":"Synced"+(ok?" · "+ok+" uploaded":"");
    syncState=left?"bad":"good";
  }catch(e){syncMsg="Couldn't read the sheet — check the URL and that access is set to Anyone. Will retry.";syncState="bad";}
  syncing=false;softRender();
}

/* ---------- views ---------- */
function timerCard(t){
  var id=t.id;
  if(t.phase==="save"){
    return'<div class="card"><div style="font-weight:700">'+esc(t.project)+' · '+esc(t.step)+'</div>'
      +'<div class="sub" style="text-align:left;margin-bottom:16px">'+esc(t.type)+' · '+dur(t.acc)+' logged</div>'
      +'<label>Description</label><input data-tid="'+id+'" data-f="desc" value="'+esc(t.desc)+'" placeholder="Short summary (optional)" maxlength="200">'
      +'<label>Is this step finished?</label><div class="seg"><button data-a="done" data-id="'+id+'" data-v="0" class="'+(!t.done?"on":"")+'">Not yet</button><button data-a="done" data-id="'+id+'" data-v="1" class="'+(t.done?"on":"")+'">Finished ✓</button></div>'
      +'<label>Focus</label><div class="focus">'
      +[1,2,3,4,5].map(function(n){return'<button data-a="focus" data-id="'+id+'" data-v="'+n+'" class="'+(t.focus===n?"on":"")+'">'+n+'</button>';}).join("")
      +'</div><label>Notes</label><textarea data-tid="'+id+'" data-f="notes" placeholder="Details, blockers, next steps…">'+esc(t.notes)+'</textarea>'
      +'<div class="row"><button class="ok big" data-a="commit" data-id="'+id+'">Save</button><button class="dng big" data-a="discard" data-id="'+id+'">Discard</button></div></div>';
  }
  return'<div class="card"><div class="sub">'+esc(t.project)+' · '+esc(t.step)+' <span class="pill '+(t.running?"run":"pause")+'">'+(t.running?"Running":"Paused")+'</span></div>'
    +'<div class="clock sm clk" data-id="'+id+'">'+clock(elapsed(t))+'</div>'
    +'<div class="sub">'+esc(t.type)+'</div>'
    +'<input data-tid="'+id+'" data-f="desc" placeholder="Add a description…" value="'+esc(t.desc)+'" maxlength="200" style="margin-top:10px">'
    +'<div class="row">'
    +(t.running?'<button class="big" data-a="pause" data-id="'+id+'">⏸ Pause</button>':'<button class="pri big" data-a="resume" data-id="'+id+'">▶ Resume</button>')
    +'<button class="big dng" data-a="stop" data-id="'+id+'">■ Stop</button></div></div>';
}
function viewTimer(){
  var d=S.draft,n=S.timers.length,ap=activeProjects();
  var h='<h1><span>Time Organizer'+(n?'<span class="tcount">'+n+' active</span>':'')+'</span>'+(S.url&&(pending()||S.ops.length)?'<span class="cloud">☁︎ '+pending()+' to upload</span>':'')+'</h1>';
  S.timers.forEach(function(t){h+=timerCard(t);});

function viewStats(){
  var days=statRange==="all"?null:+statRange;
  var from=days===null?0:(function(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()-(days-1)*864e5;})();
  var rows=S.sessions.filter(function(s){return s.ts>=from;});
  var tot=rows.reduce(function(a,s){return a+s.ms;},0);
  var avgF=rows.length?(rows.reduce(function(a,s){return a+s.focus;},0)/rows.length).toFixed(1):"–";
  var h='<h1>Stats</h1><div class="chips">'
    +[["1","Today"],["7","7 days"],["30","30 days"],["all","All"]].map(function(c){return'<button data-a="range" data-v="'+c[0]+'" class="'+(statRange===c[0]?"on":"")+'">'+c[1]+'</button>';}).join("")
    +'</div><div class="stat"><div><b>'+dur(tot)+'</b><small>Total</small></div><div><b>'+rows.length+'</b><small>Sessions</small></div><div><b>'+avgF+'</b><small>Avg focus</small></div></div>';
  if(S.goalH){
    var tm=todayMs(),pc=Math.min(100,tm/(S.goalH*36e5)*100);
    h+='<div class="card"><label>Daily goal</label><div class="goal"><i style="width:'+pc+'%"></i></div><div class="sub" style="text-align:left">'+dur(tm)+' of '+S.goalH+'h today</div></div>';
  }
  var wk=[];for(var i=6;i>=0;i--){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);var k=dayKey(d.getTime());wk.push({k:k,l:d.toLocaleDateString(undefined,{weekday:"narrow"}),ms:S.sessions.filter(function(s){return dayKey(s.ts)===k;}).reduce(function(a,s){return a+s.ms;},0)});}
  var mx=Math.max.apply(null,wk.map(function(x){return x.ms;}).concat([1]));
  h+='<div class="card"><label>Last 7 days</label><div class="week">'+wk.map(function(x){return'<div><span>'+(x.ms?(x.ms/36e5).toFixed(1):"")+'</span><i style="height:'+(x.ms/mx*80)+'%"></i><span style="margin-top:4px">'+x.l+'</span></div>';}).join("")+'</div></div>';
  function group(field,title){
    var m={};rows.forEach(function(s){var o=m[s[field]]||(m[s[field]]={ms:0});o.ms+=s.ms;});
    var keys=Object.keys(m).sort(function(a,b){return m[b].ms-m[a].ms;});
    if(!keys.length)return"";
    var top=m[keys[0]].ms||1;
    return'<div class="card"><label>'+title+'</label>'+keys.map(function(k){return'<div class="bar"><span class="n">'+esc(k)+'</span><span class="t"><i style="width:'+(m[k].ms/top*100)+'%"></i></span><span class="v">'+dur(m[k].ms)+'</span></div>';}).join("")+'</div>';
  }
  if(!rows.length)h+='<div class="empty">Nothing logged in this range.</div>';
  else h+=group("project","By project")+group("type","By type")+group("step","By step");
  // per-project step breakdown (all time): where did the time go, which steps are finished
  var names=[];S.sessions.forEach(function(s){if(names.indexOf(s.project)<0)names.push(s.project);});
  if(names.length){
    if(names.indexOf(statProj)<0)statProj=names[0];
    var ps=S.sessions.filter(function(s){return s.project===statProj;});
    var steps=stepsFor(statProj);
    ps.forEach(function(s){if(steps.indexOf(s.step)<0)steps.push(s.step);});
    var agg={};steps.forEach(function(s){agg[s]={ms:0,done:false};});
    ps.forEach(function(s){agg[s.step].ms+=s.ms;if(s.done)agg[s.step].done=true;});
    var top2=Math.max.apply(null,steps.map(function(s){return agg[s].ms;}).concat([1]));
    h+='<div class="card"><label>Project breakdown (all time)</label><select id="statProj">'+opts(names,statProj)+'</select>'
      +steps.map(function(s){var a=agg[s];return'<div class="bar'+(a.ms||a.done?'':' zero')+'"><span class="n">'+esc(s)+(a.done?' ✓':'')+'</span><span class="t"><i style="width:'+(a.ms/top2*100)+'%"></i></span><span class="v">'+(a.ms?dur(a.ms):'–')+'</span></div>';}).join("")
      +'<div class="sub" style="text-align:left;margin-top:8px">Total '+dur(ps.reduce(function(a,s){return a+s.ms;},0))+'</div></div>';
  }
  return h;
}

function rowsSorted(){return S.sessions.slice().sort(function(a,b){return a.ts-b.ts;});}
function cell(v){v=String(v==null?"":v);return/[",\n\r\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function flat(v){return String(v||"").replace(/[\t\r\n]+/g," ");}
function tsvOf(list){return list.map(function(s){return[stamp(s.ts),s.type,s.project,s.step,(s.ms/60000).toFixed(1),s.focus,s.done?"Yes":"No",flat(s.desc),flat(s.notes)].join("\t");}).join("\n");}
function tsv(){return tsvOf(rowsSorted());}
function csv(){return"Date,Type,Project,Step,Minutes,Focus,Step done,Description,Notes\n"+rowsSorted().map(function(s){return[stamp(s.ts),s.type,s.project,s.step,(s.ms/60000).toFixed(1),s.focus,s.done?"Yes":"No",s.desc||"",s.notes||""].map(cell).join(",");}).join("\n");}
function backup(){return{v:3,types:S.types,projects:S.projects,sessions:S.sessions};}
async function saveFile(name,data,type){
  try{
    var dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:data});toast("Saved");return;}
  }catch(e){if(e&&e.code==="declined")return;}
  try{
    var file=new File([data],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}
    var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  }catch(e){if(e&&e.name!=="AbortError")toast("Couldn't save — try Copy instead");}
}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg);return;}catch(e){}
  try{var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();var ok=document.execCommand("copy");document.body.removeChild(t);toast(ok?msg:"Copy blocked on this device");}
  catch(e){toast("Copy blocked on this device");}
}
function restoreData(data){
  var list=Array.isArray(data)?data:(data&&data.sessions)||[];
  if(!Array.isArray(list))throw new Error("bad");
  if(data&&!Array.isArray(data)){
    (data.types||[]).forEach(function(t){if(t&&t.name){var ty=ensType(t.name);(t.steps||[]).forEach(function(s){ensStep(ty,String(s));});}});
    (data.projects||[]).forEach(function(p){
      if(p&&p.name&&p.type){ensType(p.type);var np=ensProj(p.name,p.type);if(/^(paused|done)$/.test(p.status)&&np.status==="active"){np.status=p.status;enqueue({op:"set_status",name:np.name,status:np.status});}
        (p.steps||[]).forEach(function(s){if(!inListCI(stepsFor(np.name),s)){np.steps.push(String(s));enqueue({op:"add_step",type:np.type,step:String(s),project:np.name});}});}
    });
  }
  var have={},added=0;S.sessions.forEach(function(s){have[s.id]=1;});
  list.forEach(function(s){
    if(!s||!s.id||!(s.ms>=0)||have[s.id])return;
    var tn=String(s.type||"General"),pn=String(s.project||"Unknown"),st=String(s.step||s.action||"Other");
    var ty=ensType(tn);ensStep(ty,st);
    var ex=findCI(S.projects,pn);ensProj(pn,ex?ex.type:ty.name);
    S.sessions.push({id:s.id,ts:s.ts,end:s.end||s.ts,ms:s.ms,type:ty.name,project:(ex?ex.name:pn),step:st,done:!!s.done,desc:String(s.desc||""),focus:Math.min(5,Math.max(1,s.focus|0||3)),notes:String(s.notes||""),synced:false});
    have[s.id]=1;added++;
  });
  return added;
}

/* ---------- actions ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;
  if(el.dataset.bg&&e.target!==el)return;
  var a=el.dataset.a,v=el.dataset.v,d=S.draft,t=el.dataset.id?T(+el.dataset.id):null;
  if(a!=="del"&&a!=="wipe"&&a!=="rmtype")armed=null;
  switch(a){
    case"tab":tab=v;render();return;
    case"start":
      var sp=$("#selP"),ss=$("#selS"),dd0=$("#desc");
      if(sp)d.project=sp.value;if(ss)d.step=ss.value;if(dd0)d.desc=dd0.value;
      var pj=getProj(d.project);
      if(!pj||!d.step){toast("Pick a project and a step first");return;}
      var nid=Date.now();while(T(nid))nid++;
      S.timers.push({id:nid,project:pj.name,type:pj.type,step:d.step,desc:(d.desc||"").trim(),running:true,startedAt:Date.now(),acc:0,first:Date.now(),phase:"run",focus:3,done:false,notes:""});
      d.desc="";save();keepAwake(true);break;
    case"pause":if(t&&t.running){t.acc+=Date.now()-t.startedAt;t.running=false;t.startedAt=null;}save();if(!anyRunning())keepAwake(false);break;
    case"resume":if(t&&!t.running){t.running=true;t.startedAt=Date.now();}save();keepAwake(true);break;
    case"stop":
      if(!t)break;
      if(t.running){t.acc+=Date.now()-t.startedAt;t.running=false;t.startedAt=null;}
      if(!anyRunning())keepAwake(false);showStop=t.id;save();break;
    case"cancel":showStop=null;break;
    case"trash":showStop=null;S.timers=S.timers.filter(function(x){return x!==t;});save();toast("Timer deleted");break;
    case"tosave":showStop=null;if(t){t.phase="save";t.end=Date.now();t.focus=3;t.done=false;}save();break;
    case"focus":if(t){t.focus=+v;save();}break;
    case"done":if(t){t.done=v==="1";save();}break;
    case"commit":
      if(!t)break;
      var sid=Date.now();while(S.sessions.some(function(x){return x.id===sid;}))sid++;
      S.sessions.push({id:sid,ts:t.first,end:t.end||Date.now(),ms:t.acc,type:t.type,project:t.project,step:t.step,done:!!t.done,desc:(t.desc||"").trim(),focus:t.focus,notes:(t.notes||"").trim(),synced:false});
      S.timers=S.timers.filter(function(x){return x!==t;});
      save();toast("Session saved · "+dur(t.acc));flush();break;
    case"discard":S.timers=S.timers.filter(function(x){return x!==t;});save();break;
    case"del":
      if(armed==="s"+v){S.sessions=S.sessions.filter(function(s){return String(s.id)!==v;});armed=null;save();}else armed="s"+v;break;
    case"range":statRange=v;break;
    case"newP":addingP=true;break;
    case"newS":addingS=true;break;
    case"cancelAdd":addingP=false;addingS=false;break;
    case"addP":
      var pn=($("#newPN").value||"").trim(),ptn=$("#newPT")?$("#newPT").value:"";
      if(!pn){toast("Type a project name first");return;}
      if(!getType(ptn)){toast("Choose a type first");return;}
      var exp=findCI(S.projects,pn);
      if(exp){if(exp.status!=="active"){exp.status="active";enqueue({op:"set_status",name:exp.name,status:"active"});}d.project=exp.name;}
      else{ensProj(pn,ptn);d.project=pn;}
      d.step="";addingP=false;save();break;
    case"addS":
      var sn=($("#newSN").value||"").trim(),only=$("#newSO")&&$("#newSO").checked,cp=getProj(d.project);
      if(!sn){toast("Type a step name first");return;}
      if(!cp)break;
      var known=stepsFor(cp.name).filter(function(x){return x.toLowerCase()===sn.toLowerCase();})[0];
      if(known){d.step=known;}
      else if(only){cp.steps.push(sn);enqueue({op:"add_step",type:cp.type,step:sn,project:cp.name});d.step=sn;}
      else{var ct=getType(cp.type);ct.steps.push(sn);enqueue({op:"add_step",type:ct.name,step:sn,project:""});d.step=sn;}
      addingS=false;save();break;
    case"addTstep":
      var ti=+el.dataset.t,tt=S.types[ti],ni=$("#ns"+ti),nv=ni?ni.value.trim():"";
      if(tt&&nv){if(inListCI(tt.steps,nv)){toast("That step already exists");return;}tt.steps.push(nv);enqueue({op:"add_step",type:tt.name,step:nv,project:""});save();}break;
    case"rmstep":S.types[+el.dataset.t].steps.splice(+v,1);save();break;
    case"rmtype":
      var rt=S.types[+el.dataset.t];
      if(S.projects.some(function(p){return p.type===rt.name;})){toast("Some projects use this type — mark them done or keep the type");return;}
      if(armed==="t"+el.dataset.t){S.types.splice(+el.dataset.t,1);armed=null;save();}else armed="t"+el.dataset.t;break;
    case"addtype":
      var tn=($("#newTN").value||"").trim(),steps=($("#newTS").value||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
      if(!tn||!steps.length){toast("Give the type a name and at least one step");return;}
      if(findCI(S.types,tn)){toast("That type already exists");return;}
      S.types.push({name:tn,steps:steps});enqueue({op:"add_type",name:tn,steps:steps});save();toast("Type added");break;
    case"sync":
      var u=$("#url");if(u){S.url=u.value.trim();save();}
      if(!S.url){syncMsg="Paste your web app URL first";syncState="bad";break;}
      syncMsg="Syncing…";syncState="";render();flush();return;
    case"csv":saveFile("time-log.csv",csv(),"text/csv");return;
    case"json":saveFile("time-organizer-backup.json",JSON.stringify(backup(),null,1),"application/json");return;
    case"copynew":
      var nr=newRows();if(!nr.length){toast("No new rows");return;}
      copy(tsvOf(nr),"Copied "+nr.length+" new row"+(nr.length===1?"":"s"));
      S.exported=Math.max.apply(null,nr.map(function(s){return s.id;}));save();setTimeout(render,50);return;
    case"copytsv":copy(tsv(),"Copied "+S.sessions.length+" rows");return;
    case"copyjson":copy(JSON.stringify(backup()),"Backup copied");return;
    case"restore":
      try{var added=restoreData(JSON.parse($("#restore").value));save();toast("Added "+added+" session"+(added===1?"":"s"));flush();}
      catch(err){toast("That doesn't look like a backup");return;}
      break;
    case"wipe":if(armed==="wipe"){S.sessions=[];armed=null;save();toast("Erased");}else armed="wipe";break;
  }
  render();
});
document.addEventListener("input",function(e){
  var tid=e.target.dataset&&e.target.dataset.tid;
  if(tid){var tt=T(+tid);if(tt){tt[e.target.dataset.f]=e.target.value;save();}return;}
  if(e.target.id==="desc"){S.draft.desc=e.target.value;save();}
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(e.target.dataset&&e.target.dataset.ps!==undefined){
    var p=S.projects[+e.target.dataset.ps];
    if(p){p.status=e.target.value;enqueue({op:"set_status",name:p.name,status:p.status});save();}
    return;
  }
  if(id==="selP"){S.draft.project=e.target.value;S.draft.step="";save();render();}
  else if(id==="selS"){S.draft.step=e.target.value;save();}
  else if(id==="statProj"){statProj=e.target.value;render();}
  else if(id==="goal"){S.goalH=Math.max(0,Math.min(24,parseFloat(e.target.value)||0));save();}
  else if(id==="theme"){S.theme=e.target.value;applyTheme();save();}
  else if(id==="awake"){S.awake=e.target.value==="1";save();if(!S.awake)keepAwake(false);}
  else if(id==="url"){S.url=e.target.value.trim();save();}
});

/* ---------- lifecycle ---------- */
// Timers store wall-clock timestamps, so they stay accurate while the phone is locked.
setInterval(tickClocks,250);
setInterval(function(){if(S.ops.length||pending())flush();},30000);
window.addEventListener("online",function(){flush();});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){
    tickClocks();
    if(anyRunning())keepAwake(true);
    flush();
  }
});

applyTheme();
save();
if(anyRunning())keepAwake(true);
render();
if(S.url)flush();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
})();
</script>
</body>
